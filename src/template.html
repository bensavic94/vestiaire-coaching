<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Vestiaire d’Aya & Camélia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout : barre duo en haut · fiche athlète · onglets Programme / Nutrition / Suivi · coach en colonne droite (tiroir sur mobile) */
:root{
  --bg:#f3f0f6; --surface:#ffffff; --surface-2:#f8f6fa; --ink:#1d1724; --muted:#6c6378; --line:#e3dde9;
  --aya:#0f8a67; --aya-soft:#e2f4ee; --cam:#c3245b; --cam-soft:#fbe5ed;
  --good:#1f8a4c; --warn:#b7791f;
  --acc:var(--aya); --acc-soft:var(--aya-soft);
  --f-display:"Syne", "Arial Black", system-ui, sans-serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:18px; --shadow:0 1px 2px rgba(29,23,36,.05), 0 8px 24px rgba(29,23,36,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131017; --surface:#1d1923; --surface-2:#241f2b; --ink:#f2edf6; --muted:#a69db1; --line:#2f2938;
    --aya:#3fcf9f; --aya-soft:#173a30; --cam:#ff6696; --cam-soft:#43182a; --good:#4ccf84; --warn:#e3a94a;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131017; --surface:#1d1923; --surface-2:#241f2b; --ink:#f2edf6; --muted:#a69db1; --line:#2f2938;
  --aya:#3fcf9f; --aya-soft:#173a30; --cam:#ff6696; --cam-soft:#43182a; --good:#4ccf84; --warn:#e3a94a;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.25);
  color-scheme:dark;
}
body[data-who="camelia"]{ --acc:var(--cam); --acc-soft:var(--cam-soft); }
body[data-who="aya"]{ --acc:var(--aya); --acc-soft:var(--aya-soft); }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; transition:background .3s}
h1,h2,h3,h4{font-family:var(--f-display); margin:0; text-wrap:balance; letter-spacing:-.01em}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc); outline-offset:2px; border-radius:8px}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.top{position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter:blur(12px); border-bottom:1px solid var(--line)}
.top-in{max-width:1320px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap}
.brand{font-family:var(--f-display); font-weight:800; font-size:17px; letter-spacing:.06em; text-transform:uppercase; display:flex; align-items:center; gap:10px}
.brand i{display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--aya); box-shadow:12px 0 0 var(--cam); margin-right:12px}
.switch{display:flex; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:4px; gap:4px}
.switch button{border:0; background:transparent; padding:7px 16px 7px 8px; border-radius:999px; font-weight:700; display:flex; align-items:center; gap:8px; color:var(--muted)}
.switch button .av{width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-family:var(--f-display); font-size:13px; color:#fff}
.switch button[data-p="aya"] .av{background:var(--aya)} .switch button[data-p="camelia"] .av{background:var(--cam)}
.switch button[aria-pressed="true"]{background:var(--acc-soft); color:var(--ink)}
.duo{margin-left:auto; display:flex; gap:14px; align-items:center; font-size:12.5px; color:var(--muted)}
.duo .d{display:flex; align-items:center; gap:7px}
.duo .bar{width:70px; height:6px; border-radius:6px; background:var(--line); overflow:hidden}
.duo .bar b{display:block; height:100%; border-radius:6px}

/* ---------- page ---------- */
.wrap{max-width:1320px; margin:0 auto; padding:22px 20px 80px; display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:24px; align-items:start}
@media (max-width:1100px){ .wrap{grid-template-columns:minmax(0,1fr)} }

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}

/* hero */
.hero{padding:26px 26px 22px; position:relative; overflow:hidden}
.hero::after{content:""; position:absolute; right:-80px; top:-90px; width:300px; height:300px; border-radius:50%; background:radial-gradient(circle, var(--acc-soft) 0%, transparent 70%); pointer-events:none}
.hero-top{display:flex; gap:20px; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; position:relative; z-index:1}
.eyebrow{font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--acc)}
.hero h1{font-size:clamp(40px,6vw,64px); line-height:.95; font-weight:800; margin-top:6px}
.hero .tag{color:var(--muted); max-width:52ch; margin:10px 0 0; font-size:15.5px}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:14px}
.chip{font-size:12.5px; font-weight:600; padding:4px 10px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); color:var(--muted)}
.countdown{display:flex; gap:10px; flex-wrap:wrap}
.cd{background:var(--acc); color:#fff; border-radius:14px; padding:10px 14px; min-width:112px}
.cd.alt{background:var(--surface-2); color:var(--ink); border:1px solid var(--line)}
.cd small{display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.85; font-weight:700}
.cd b{font-family:var(--f-display); font-size:30px; line-height:1.1}
.cd span{display:block; font-size:12px; opacity:.85}
.cd b{white-space:nowrap}

.tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:22px; position:relative; z-index:1}
@media (max-width:720px){ .tiles{grid-template-columns:repeat(2,1fr)} }
.tile{background:var(--surface-2); border:1px solid var(--line); border-radius:14px; padding:12px 14px}
.tile small{color:var(--muted); font-size:12px; font-weight:600}
.tile b{display:block; font-family:var(--f-display); font-size:24px; line-height:1.2; margin-top:2px}
.tile span{font-size:12px; color:var(--muted)}
.prog{height:8px; background:var(--line); border-radius:8px; overflow:hidden; margin-top:8px}
.prog b{display:block; height:100%; background:var(--acc); border-radius:8px; transition:width .6s}

.note{margin-top:18px; display:grid; grid-template-columns:auto 1fr; gap:14px; padding:16px 18px; border-radius:14px; background:var(--acc-soft); position:relative; z-index:1}
.note .stamp{width:52px; height:52px; border-radius:14px; background:var(--acc); color:#fff; display:grid; place-items:center; text-align:center; line-height:1; font-family:var(--f-display); font-weight:800; font-size:11px}
.note h4{font-size:14px; margin-bottom:4px}
.note p{margin:0; font-size:14.5px; max-width:75ch}

/* tabs */
.tabs{display:flex; gap:6px; margin:22px 0 14px; flex-wrap:wrap}
.tabs button{border:1px solid var(--line); background:var(--surface); padding:9px 18px; border-radius:999px; font-weight:700; color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.panel[hidden]{display:none}

.sec-h{display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:6px 2px 12px}
.sec-h h2{font-size:22px}
.sec-h p{margin:0; color:var(--muted); font-size:13.5px}

/* phases */
.phases{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:8px; margin-bottom:14px}
.phase{text-align:left; border:1px solid var(--line); background:var(--surface); border-radius:14px; padding:12px 14px; position:relative}
.phase small{font-size:11.5px; color:var(--muted); font-weight:600}
.phase b{display:block; font-family:var(--f-display); font-size:16px}
.phase .now{position:absolute; top:10px; right:10px; font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--acc)}
.phase[aria-pressed="true"]{border-color:var(--acc); box-shadow:inset 0 0 0 1px var(--acc); background:var(--acc-soft)}
.phase-txt{margin:-4px 2px 14px; color:var(--muted); font-size:14px}

.energy{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:12px 14px; border-radius:14px; border:1px dashed var(--line); margin-bottom:16px}
.energy > span{font-weight:700; font-size:14px}
.energy button{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:6px 13px; font-weight:600; font-size:13.5px}
.energy button[aria-pressed="true"]{background:var(--acc); color:#fff; border-color:var(--acc)}
.energy em{font-style:normal; color:var(--muted); font-size:13px; flex-basis:100%}

/* sessions */
.sessions{display:grid; gap:14px}
.sess{overflow:hidden}
.sess-h{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; padding:16px 18px; border-bottom:1px solid var(--line)}
.dayb{width:54px; height:54px; border-radius:14px; background:var(--acc-soft); color:var(--acc); display:grid; place-items:center; text-align:center; line-height:1.05; font-family:var(--f-display); font-weight:800; font-size:12px; text-transform:uppercase}
.dayb b{font-size:20px; display:block}
.sess-h h3{font-size:18px}
.sess-h p{margin:0; color:var(--muted); font-size:13px}
.sess-act{display:flex; gap:8px; align-items:center}
.btn{border:0; background:var(--acc); color:#fff; font-weight:700; padding:9px 15px; border-radius:12px; display:inline-flex; align-items:center; gap:8px; font-size:14px}
.btn.ghost{background:var(--surface-2); color:var(--ink); border:1px solid var(--line)}
.btn:disabled{opacity:.45; cursor:default}
.done-t{width:38px; height:38px; border-radius:12px; border:2px solid var(--line); background:var(--surface); display:grid; place-items:center; font-weight:800; color:transparent}
.done-t[aria-pressed="true"]{background:var(--good); border-color:var(--good); color:#fff}
@media (max-width:620px){ .sess-h{grid-template-columns:auto 1fr} .sess-act{grid-column:1/-1} }
.warm{padding:10px 18px; font-size:13px; color:var(--muted); background:var(--surface-2); border-bottom:1px solid var(--line)}
.warm b{color:var(--ink)}
.ex{display:grid; grid-template-columns:28px 1fr auto auto auto; gap:10px; align-items:center; padding:12px 18px; border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex .i{font-family:var(--f-display); font-weight:700; color:var(--muted); font-size:13px}
.ex .n{font-weight:700}
.ex .c{font-size:13px; color:var(--muted); margin-top:1px}
.ex .rx{font-family:var(--f-display); font-weight:700; text-align:right; white-space:nowrap}
.ex .rx small{display:block; font-family:var(--f-body); font-weight:500; color:var(--muted); font-size:12px}
.ex.cardio .rx{white-space:normal; max-width:190px; font-size:14px}
.alt{border:1px solid var(--line); background:var(--surface); width:32px; height:32px; border-radius:10px; color:var(--muted); font-size:15px}
.alt:hover{color:var(--acc); border-color:var(--acc)}
@media (max-width:620px){ .ex{grid-template-columns:22px 1fr auto auto} .ex .rx{grid-column:2 / -1; text-align:left} .ex .alt{grid-row:1} }
.alt.how{font-family:var(--f-display); font-weight:800; color:var(--acc); border-color:color-mix(in srgb, var(--acc) 35%, var(--line))}
.howlink{border:0; background:none; color:var(--acc); font-weight:700; text-decoration:underline; margin-top:8px; font-size:14px}
/* fiche exercice + bibliothèque */
.sheet{position:fixed; inset:0; z-index:85; display:none; align-items:center; justify-content:center; padding:16px; background:color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter:blur(8px)}
.sheet.open{display:flex}
.sheet .card{width:min(640px,100%); max-height:88vh; overflow:auto; padding:24px; position:relative}
.sheet .close{position:absolute; right:14px; top:14px; border:0; background:var(--surface-2); border-radius:10px; width:36px; height:36px}
.sheet h2{font-size:24px; margin:6px 40px 8px 0}
.sheet h3{font-size:17px; margin:22px 0 6px; padding-top:14px; border-top:1px solid var(--line)}
.sheet h3:first-of-type{border-top:0; padding-top:0}
.g-sec{margin-top:12px}
.g-sec b.lab{display:block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc); margin-bottom:4px}
.g-sec p{margin:0; font-size:14.5px}
.g-sec ol, .g-sec ul{margin:0; padding-left:20px; font-size:14.5px; display:grid; gap:4px}
.g-two{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
@media (max-width:520px){ .g-two{grid-template-columns:1fr} }
.g-two div{background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:14px}
.g-two b{display:block; font-size:12px; color:var(--muted); margin-bottom:2px}
.g-alt{background:var(--acc-soft) !important; border-color:var(--acc) !important}
.g-act{display:flex; gap:8px; flex-wrap:wrap; margin-top:18px}
.g-act a{text-decoration:none}
.lib-search{width:100%; border:1px solid var(--line); background:var(--surface-2); border-radius:12px; padding:11px 13px; margin:6px 0 10px}
.lib-cats{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
.lib-cats button{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:5px 12px; font-weight:600; font-size:13px}
.lib-cats button[aria-pressed="true"]{background:var(--acc); color:#fff; border-color:var(--acc)}
.lib-list{display:grid; gap:6px}
.lib-list details{border:1px solid var(--line); border-radius:12px; background:var(--surface)}
.lib-list summary{cursor:pointer; padding:11px 14px; font-weight:700; font-size:14.5px; list-style:none; display:flex; justify-content:space-between; gap:10px}
.lib-list summary::after{content:"+"; color:var(--acc); font-weight:800}
.lib-list details[open] summary::after{content:"−"}
.lib-list details p{margin:0; padding:0 14px 12px; font-size:14px; color:var(--ink)}
.lib-list .cat{font-size:11px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin:10px 2px 0}
.sugg .more{background:var(--ink); color:var(--bg); border-color:var(--ink)}

/* nutrition */
.nut-top{display:grid; grid-template-columns:260px 1fr; gap:14px}
@media (max-width:760px){ .nut-top{grid-template-columns:1fr} }
.ring-card{padding:18px; display:grid; place-items:center; text-align:center}
.macros{padding:18px 20px; display:grid; gap:14px}
.mac-row{display:grid; grid-template-columns:110px 1fr 80px; gap:12px; align-items:center}
.mac-row .lab b{display:block; font-size:14px}
.mac-row .lab small{color:var(--muted); font-size:12px}
.mac-row .bar{height:10px; border-radius:10px; background:var(--line); overflow:hidden}
.mac-row .bar b{display:block; height:100%; border-radius:10px}
.mac-row .v{text-align:right; font-family:var(--f-display); font-weight:700}
.plate{display:flex; gap:14px; align-items:center; border-top:1px solid var(--line); padding-top:14px}
.plate p{margin:0; font-size:13.5px; color:var(--muted)}
.plate p b{color:var(--ink)}
.meals{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:14px}
@media (max-width:760px){ .meals{grid-template-columns:1fr} }
.meal{padding:16px 18px; display:flex; flex-direction:column; gap:8px}
.meal-h{display:flex; justify-content:space-between; align-items:center; gap:10px}
.meal-h h4{font-size:15px}
.meal-h small{color:var(--muted); font-size:12px; font-weight:600}
.meal .dish{font-weight:700; font-size:15.5px}
.meal ul{margin:0; padding-left:18px; font-size:13.5px; color:var(--muted)}
.meal-f{display:flex; justify-content:space-between; align-items:center; margin-top:auto; padding-top:8px; border-top:1px dashed var(--line)}
.kp{display:flex; gap:8px; font-size:12.5px; font-weight:700}
.kp span{padding:3px 9px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line)}
.dots{display:flex; gap:5px; align-items:center}
.dots i{width:7px; height:7px; border-radius:50%; background:var(--line)}
.dots i.on{background:var(--acc)}
.swap{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:5px 10px; font-size:12.5px; font-weight:700}
.daytotal{margin-top:14px; padding:14px 18px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.daytotal b{font-family:var(--f-display); font-size:20px}
.rules{margin-top:14px; padding:18px 20px}
.rules ol{margin:10px 0 0; padding:0; list-style:none; display:grid; gap:10px; counter-reset:r}
.rules li{display:grid; grid-template-columns:28px 1fr; gap:10px; font-size:14px; counter-increment:r}
.rules li::before{content:counter(r); width:24px; height:24px; border-radius:8px; background:var(--acc-soft); color:var(--acc); display:grid; place-items:center; font-family:var(--f-display); font-weight:800; font-size:12px}
.rules li b{display:block}
.rules li span{color:var(--muted)}
.shop{margin-top:14px; padding:18px 20px}
.shop-g{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-top:10px}
.shop-g h5{margin:0 0 4px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--acc)}
.shop-g ul{margin:0; padding-left:16px; font-size:13.5px}

/* suivi */
.track-top{display:grid; grid-template-columns:1fr 290px; gap:14px}
@media (max-width:860px){ .track-top{grid-template-columns:1fr} }
.chart-card{padding:18px 18px 10px}
.chart-card svg{width:100%; height:auto; display:block}
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin-top:6px}
.legend i{display:inline-block; width:18px; height:3px; border-radius:2px; vertical-align:middle; margin-right:6px}
.log{padding:18px}
.log label{display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin:10px 0 4px}
.log input{width:100%; border:1px solid var(--line); background:var(--surface-2); border-radius:12px; padding:10px 12px}
.log .btn{width:100%; justify-content:center; margin-top:12px}
.hist{margin-top:12px; max-height:170px; overflow:auto; font-size:13.5px}
.hist div{display:flex; justify-content:space-between; padding:6px 2px; border-bottom:1px solid var(--line)}
.hist button{border:0; background:none; color:var(--muted); font-size:12px}
.week{margin-top:14px; padding:18px}
.weekgrid{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.wk{width:30px; height:30px; border-radius:8px; background:var(--surface-2); border:1px solid var(--line); display:grid; place-items:center; font-size:11px; font-weight:700; color:var(--muted)}
.wk.l1{background:color-mix(in srgb, var(--acc) 25%, var(--surface-2))}
.wk.l2{background:color-mix(in srgb, var(--acc) 50%, var(--surface-2)); color:var(--ink)}
.wk.l3{background:color-mix(in srgb, var(--acc) 75%, var(--surface-2)); color:#fff}
.wk.l4{background:var(--acc); color:#fff}
.wk.cur{outline:2px solid var(--ink); outline-offset:1px}
.badges{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:14px}
.badge{padding:12px 14px; border-radius:14px; border:1px solid var(--line); background:var(--surface); display:flex; gap:10px; align-items:center; opacity:.55}
.badge.on{opacity:1; border-color:var(--acc); background:var(--acc-soft)}
.badge .m{width:34px; height:34px; border-radius:50%; background:var(--line); display:grid; place-items:center; font-family:var(--f-display); font-weight:800; font-size:12px; flex:none}
.badge.on .m{background:var(--acc); color:#fff}
.badge b{font-size:13.5px; display:block; line-height:1.25}
.badge small{font-size:11.5px; color:var(--muted)}
.sync{font-size:12px; color:var(--muted); margin-top:10px}

/* coach */
.coach{position:sticky; top:76px; display:flex; flex-direction:column; height:calc(100vh - 100px); max-height:860px; min-height:520px; overflow:hidden}
.coach-h{padding:16px 18px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center}
.coach-h .ph{width:44px; height:44px; border-radius:14px; background:var(--ink); color:var(--bg); display:grid; place-items:center; font-family:var(--f-display); font-weight:800; position:relative}
.coach-h .ph::after{content:""; position:absolute; right:-3px; bottom:-3px; width:12px; height:12px; border-radius:50%; background:var(--good); border:2px solid var(--surface)}
.coach-h b{font-family:var(--f-display); font-size:16px; display:block}
.coach-h small{color:var(--muted); font-size:12.5px}
.coach-h .x{margin-left:auto; border:0; background:var(--surface-2); width:34px; height:34px; border-radius:10px; display:none}
.msgs{flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:10px}
.msg{max-width:88%; padding:10px 13px; border-radius:16px; font-size:14px; white-space:pre-wrap; word-wrap:break-word}
.msg.c{background:var(--surface-2); border:1px solid var(--line); border-bottom-left-radius:6px}
.msg.u{background:var(--acc); color:#fff; align-self:flex-end; border-bottom-right-radius:6px}
.msg.sys{align-self:center; font-size:12px; color:var(--muted); background:none; padding:2px}
.msg.c b{font-weight:700}
.sugg{display:flex; gap:6px; flex-wrap:wrap; padding:0 16px 10px}
.sugg button{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:5px 11px; font-size:12.5px; font-weight:600; text-align:left}
.sugg button:hover{border-color:var(--acc); color:var(--acc)}
.compose{display:flex; gap:8px; padding:12px; border-top:1px solid var(--line)}
.compose input{flex:1; border:1px solid var(--line); background:var(--surface-2); border-radius:12px; padding:11px 13px; min-width:0}
.compose button{border:0; background:var(--acc); color:#fff; border-radius:12px; padding:0 16px; font-weight:700}
.fab{display:none; position:fixed; right:16px; bottom:16px; z-index:40; border:0; background:var(--ink); color:var(--bg); padding:13px 18px; border-radius:999px; font-weight:800; box-shadow:0 10px 30px rgba(0,0,0,.25)}
@media (max-width:1100px){
  .coach{position:fixed; inset:auto 0 0 0; top:auto; height:82vh; max-height:none; z-index:50; border-radius:22px 22px 0 0; transform:translateY(105%); transition:transform .3s ease}
  .coach.open{transform:none}
  .coach-h .x{display:grid; place-items:center}
  .fab{display:block}
}

/* player */
.player{position:fixed; inset:0; z-index:80; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(10px); display:none; align-items:center; justify-content:center; padding:16px}
.player.open{display:flex}
.pl{width:min(560px,100%); padding:24px; text-align:center; position:relative}
.pl .close{position:absolute; right:14px; top:14px; border:0; background:var(--surface-2); border-radius:10px; width:36px; height:36px}
.pl .step{font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--acc)}
.pl h2{font-size:28px; margin:8px 0 4px}
.pl .rx{font-family:var(--f-display); font-size:20px; font-weight:700}
.pl .cue{color:var(--muted); font-size:14px; max-width:44ch; margin:10px auto 0}
.timer{width:190px; height:190px; margin:20px auto 10px; position:relative}
.timer svg{width:100%; height:100%; transform:rotate(-90deg)}
.timer .t{position:absolute; inset:0; display:grid; place-items:center; text-align:center; font-family:var(--f-display); font-size:44px; font-weight:800; line-height:1}
.timer .t small{display:block; font-family:var(--f-body); font-size:12px; color:var(--muted); font-weight:600; margin-top:6px}
.setdots{display:flex; justify-content:center; gap:8px; margin:6px 0 16px}
.setdots i{width:30px; height:8px; border-radius:6px; background:var(--line)}
.setdots i.on{background:var(--acc)}
.pl-act{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
.pl-act .btn{padding:12px 20px; font-size:15px}
.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(120px); background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:12px; font-weight:700; font-size:14px; z-index:90; transition:transform .3s}
.toast.on{transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
.typing{display:inline-flex; gap:4px}
.typing i{width:6px; height:6px; border-radius:50%; background:var(--muted); animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.3}50%{opacity:1}}
footer{grid-column:1/-1; color:var(--muted); font-size:12.5px; text-align:center; padding-top:10px}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = (n,d=1) => Number(n).toLocaleString("fr-FR",{minimumFractionDigits:d, maximumFractionDigits:d});
const DAY = 864e5;
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const weekNo = (d=today()) => Math.max(1, Math.floor((d - parse(START))/ (7*DAY)) + 1);
const dateOfWeek = w => new Date(parse(START).getTime() + w*7*DAY);
const frDate = d => d.toLocaleDateString("fr-FR",{day:"numeric", month:"long"});
const frShort = d => d.toLocaleDateString("fr-FR",{day:"numeric", month:"short"});

function curPhaseIdx(p){ const w = weekNo(); let i = 0; p.phases.forEach((ph,k)=>{ if(w >= ph.from) i = k; }); return i; }
function latestW(k){ const a = S[k].weights; if(!a.length) return P[k].w0; return [...a].sort((x,y)=>x.d.localeCompare(y.d)).at(-1).kg; }
function pct(k){ const p = P[k]; const lost = p.w0 - latestW(k); return Math.max(0, Math.min(100, lost/(p.w0-p.goal)*100)); }
function weekDone(k, w=weekNo()){ return S[k].done["w"+w] || []; }

/* trajectoire : 2 premières semaines plus rapides (eau), puis rythme régulier */
function projAt(p, t){
  let w;
  if (t <= 2) w = p.w0 - t*0.9;
  else {
    const fit = p.deadlines[0] ? (parse(p.deadlines[0].d) - parse(START))/(7*DAY) : Infinity;
    if (t <= fit) w = p.w0 - 1.8 - (t-2)*p.rate;
    else w = p.w0 - 1.8 - (fit-2)*p.rate - (t-fit)*p.rateAfter;
  }
  return Math.max(p.goal, w);
}
function weekWhen(p, kg){ for(let t=0; t<80; t+=0.1){ if(projAt(p,t) <= kg + 1e-9) return t; } return null; }

function rxFor(e, ph){
  if (e.cardio){
    let s = e.cardio[Math.min(ph, e.cardio.length-1)];
    if (energy === 0) s = s.replace(/(\d+) min/, (m,n)=> Math.max(10, Math.round(n*0.6))+" min");
    return {txt:s, sets:1, rest:0};
  }
  let [sets, reps] = e.p[Math.min(ph, e.p.length-1)];
  if (energy === 0) sets = Math.max(2, sets-1);
  return {txt:`${sets} × ${reps}`, sets, reps, rest:e.r};
}

function donut(p){
  const tot = p.Pg*4 + p.Gg*4 + p.Lg*9; const R = 70, C = 2*Math.PI*R;

  const arcs = parts.map(([v,c])=>{ const l = v/tot*C; const s = `<circle cx="90" cy="90" r="${R}" fill="none" stroke="${c}" stroke-width="18" stroke-dasharray="${l-3} ${C-l+3}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"/>`; off += l; return s; }).join("");
  return `<svg viewBox="0 0 180 180" width="190" height="190" role="img" aria-label="Répartition des calories">
    <circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--line)" stroke-width="18"/>${arcs}
    <text x="90" y="88" text-anchor="middle" font-family="Syne" font-weight="800" font-size="30" fill="var(--ink)">${p.kcal.toLocaleString("fr-FR")}</text>

/* ===================== SUIVI ===================== */
function chart(){
  const p = P[who]; const W = 640, H = 300, m = {l:40,r:16,t:16,b:30};
  const horizon = p.deadlines.length ? Math.ceil((parse(p.deadlines.at(-1).d)-parse(START))/(7*DAY))+2 : Math.ceil((weekWhen(p,p.goal)||26))+3;
  const pts = [...S[who].weights].sort((a,b)=>a.d.localeCompare(b.d)).map(x=>({t:(parse(x.d)-parse(START))/(7*DAY), kg:x.kg}));
  const all = pts.map(x=>x.kg).concat([p.w0, p.goal]);
  const yMax = Math.ceil(Math.max(...all)+1), yMin = Math.floor(Math.min(...all)-1);
  const X = t => m.l + (t/horizon)*(W-m.l-m.r), Y = kg => m.t + (yMax-kg)/(yMax-yMin)*(H-m.t-m.b);
  let g = "";
  for (let kg = Math.ceil(yMin); kg <= yMax; kg++){ if ((kg - yMin) % 2) continue;
    g += `<line x1="${m.l}" x2="${W-m.r}" y1="${Y(kg)}" y2="${Y(kg)}" stroke="var(--line)"/><text x="${m.l-8}" y="${Y(kg)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${kg}</text>`; }
  for (let t = 0; t <= horizon; t += 4){ g += `<text x="${X(t)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${frShort(dateOfWeek(t))}</text>`; }
  p.deadlines.forEach(d=>{ const t = (parse(d.d)-parse(START))/(7*DAY);
    g += `<line x1="${X(t)}" x2="${X(t)}" y1="${m.t}" y2="${H-m.b}" stroke="var(--cam)" stroke-dasharray="3 4"/><text x="${X(t)-4}" y="${m.t+12}" text-anchor="end" font-size="11" font-weight="700" fill="var(--cam)">${d.label}</text>`; });
  p.milestones.forEach(ms=>{ if (ms.kg < yMin || ms.kg > yMax) return;
    g += `<line x1="${m.l}" x2="${W-m.r}" y1="${Y(ms.kg)}" y2="${Y(ms.kg)}" stroke="var(--warn)" stroke-dasharray="2 4"/><text x="${W-m.r}" y="${Y(ms.kg)-5}" text-anchor="end" font-size="11" fill="var(--warn)">${ms.kg} kg · ${esc(ms.label)}</text>`; });
  g += `<line x1="${m.l}" x2="${W-m.r}" y1="${Y(p.goal)}" y2="${Y(p.goal)}" stroke="var(--acc)" stroke-width="1.5"/><text x="${m.l+6}" y="${Y(p.goal)-6}" font-size="11" font-weight="700" fill="var(--acc)">Objectif ${p.goal} kg</text>`;
  let d = "", area = "";
  for (let t = 0; t <= horizon; t += 0.25){ d += (t?"L":"M")+X(t).toFixed(1)+" "+Y(projAt(p,t)).toFixed(1)+" "; }
  area = d + `L${X(horizon)} ${H-m.b} L${X(0)} ${H-m.b} Z`;
  g += `<path d="${area}" fill="var(--acc)" opacity=".08"/><path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-dasharray="6 5" opacity=".7"/>`;
  if (pts.length){
    const line = pts.map((q,i)=>(i?"L":"M")+X(q.t).toFixed(1)+" "+Y(q.kg).toFixed(1)).join(" ");
    g += `<path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>`;
    pts.forEach((q,i)=>{ const last = i===pts.length-1; g += `<circle cx="${X(q.t)}" cy="${Y(q.kg)}" r="${last?5.5:3.5}" fill="${last?'var(--acc)':'var(--ink)'}" stroke="var(--surface)" stroke-width="2"/>`; });
    const l = pts.at(-1); g += `<text x="${X(l.t)+9}" y="${Y(l.kg)+4}" font-size="12" font-weight="700" fill="var(--ink)">${fmt(l.kg)}</text>`;
  }
  const tn = (today()-parse(START))/(7*DAY);
  g += `<line x1="${X(tn)}" x2="${X(tn)}" y1="${m.t}" y2="${H-m.b}" stroke="var(--muted)" opacity=".5"/><text x="${X(tn)+4}" y="${m.t+12}" font-size="10.5" fill="var(--muted)">aujourd’hui</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trajectoire de poids prévue et pesées">${g}</svg>`;
}
function badges(){
  const p = P[who]; const lost = p.w0 - latestW(who);
  const weeks = Object.values(S[who].done);
  const total = weeks.reduce((a,b)=>a+b.length,0);
  const full = weeks.filter(w=>w.length>=p.freq).length;
  const list = [
    ["1", "Première séance", "Le plus dur est fait", total>=1],
    ["4/4", "Semaine parfaite", "4 séances sur 4", full>=1],
    ["−2", "Premiers −2 kg", "Ça bouge", lost>=2],
    ["−5", "Cap des −5 kg", "Le corps change", lost>=5],
    who==="camelia" ? ["68", "Retour à 68 kg", "Ton ancien record", latestW(who)<=68] : ["−10", "Cap des −10 kg", "Équilibre en vue", lost>=10],
    ["20", "20 séances", "La régularité paie", total>=20]
  ];
  return list.map(([m,b,s,on])=>`<div class="badge ${on?'on':''}"><div class="m">${m}</div><div><b>${b}</b><small>${s}</small></div></div>`).join("");
}

  $("#p-suivi").innerHTML = `

        <label for="inDate">Date</label><input id="inDate" type="date" value="${iso(today())}">
        <label for="inKg">Poids (kg)</label><input id="inKg" type="number" step="0.1" min="35" max="160" placeholder="${fmt(latestW(who))}">
        <label for="inWaist">Tour de taille (cm, facultatif)</label><input id="inWaist" type="number" step="0.5" min="40" max="160">
        <button class="btn" id="addW">Enregistrer</button>
        <div class="hist">${hist.length? hist.map(x=>`<div><span>${frDate(parse(x.d))}</span><span class="num"><b>${fmt(x.kg)} kg</b>${x.waist?` · ${fmt(x.waist)} cm`:""} <button data-del="${x.d}" aria-label="Supprimer la pesée du ${x.d}">✕</button></span></div>`).join("") : '<div><span style="color:var(--muted)">Point de départ : '+fmt(p.w0)+' kg. Ajoute ta première pesée.</span></div>'}</div>
        <div class="sync" id="syncNote"></div>

    <div class="card week"><h3 style="font-size:17px">Régularité</h3><p style="margin:2px 0 0;font-size:13px;color:var(--muted)">Chaque case est une semaine : plus elle est foncée, plus tu as fait de séances. Coche tes séances dans l’onglet Programme.</p>
      <div class="weekgrid">${wk}</div>

  renderSync();

}

/* ===================== MODE SÉANCE ===================== */
let PL = null, ac = null;
function beep(){ try { ac = ac || new (window.AudioContext||window.webkitAudioContext)(); [0,0.18,0.36].forEach((d,i)=>{ const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = i===2?1046:784; g.gain.setValueAtTime(.0001, ac.currentTime+d); g.gain.exponentialRampToValueAtTime(.25, ac.currentTime+d+.02); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+d+.15); o.connect(g).connect(ac.destination); o.start(ac.currentTime+d); o.stop(ac.currentTime+d+.16); }); } catch(e){} }
function openPlayer(si){
  const p = P[who]; const ph = Math.min(phaseSel ?? curPhaseIdx(p), 2);
  PL = {si, ph, ei:0, set:0, rest:0, left:0, timer:null};
  try { ac = ac || new (window.AudioContext||window.webkitAudioContext)(); } catch(e){}
  $("#player").classList.add("open"); drawPlayer();
}
function closePlayer(){ if (PL) clearInterval(PL.timer); PL = null; $("#player").classList.remove("open"); }
function drawPlayer(){
  const p = P[who]; const s = p.sessions[PL.si];
  if (PL.ei >= s.ex.length){
    $("#pl").innerHTML = `<button class="close" data-pl="close" aria-label="Fermer">✕</button>
      <div class="step">Séance terminée</div><h2>Bravo ${esc(p.name)} !</h2>
      <p class="cue">${esc(s.title)} bouclée. Étire-toi 5 minutes, bois un grand verre d’eau et prends ton repas ou ta collation protéinée dans les 2 heures.</p>
      <div class="pl-act" style="margin-top:20px"><button class="btn" data-pl="finish">Valider la séance ✓</button></div>`;
    return;
  }
  const e = s.ex[PL.ei]; const r = rxFor(e, PL.ph); const C = 2*Math.PI*84;
  const resting = PL.left > 0;
  const prog = resting ? PL.left / PL.rest : 1;
  $("#pl").innerHTML = `<button class="close" data-pl="close" aria-label="Fermer">✕</button>
    <div class="step">${esc(s.title)} · exercice ${PL.ei+1} / ${s.ex.length}</div>
    <h2>${esc(e.n)}</h2><div class="rx num">${esc(r.txt)}</div>
    <p class="cue">${esc(e.c)}</p>
    ${GUIDE_OF[e.n] ? `<button class="howlink" data-guidename="${esc(e.n)}">Comment faire cet exercice ?</button>` : ""}
    ${e.cardio ? "" : `<div class="timer"><svg viewBox="0 0 190 190"><circle cx="95" cy="95" r="84" fill="none" stroke="var(--line)" stroke-width="10"/><circle id="arc" cx="95" cy="95" r="84" fill="none" stroke="var(--acc)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-prog)}"/></svg>
      <div class="t"><div>${resting ? `<span id="tl" class="num">${PL.left}</span><small>repos</small>` : `<span class="num">${PL.set+1}</span><small>série en cours</small>`}</div></div></div>
      <div class="setdots">${Array.from({length:r.sets},(_,i)=>`<i class="${i<PL.set?'on':''}"></i>`).join("")}</div>`}
    <div class="pl-act" style="${e.cardio?'margin-top:20px':''}">
      ${e.cardio ? `<button class="btn" data-pl="next">Cardio terminé →</button>`
        : resting ? `<button class="btn ghost" data-pl="skip">Passer le repos</button>`
        : `<button class="btn" data-pl="set">Série terminée</button>`}
      <button class="btn ghost" data-pl="next">${PL.ei === s.ex.length-1 ? "Terminer" : "Exercice suivant"}</button>
    </div>`;
}
document.getElementById("player").addEventListener("click", e=>{
  const b = e.target.closest("[data-pl]"); if (!b || !PL) return;
  const a = b.dataset.pl; const s = P[who].sessions[PL.si]; const ex = s.ex[PL.ei];
  if (a === "close") return closePlayer();
  if (a === "finish"){ const si = PL.si; closePlayer(); toggleDone(si, true); return; }
  if (a === "next"){ clearInterval(PL.timer); PL.ei++; PL.set = 0; PL.left = 0; return drawPlayer(); }
  if (a === "skip"){ clearInterval(PL.timer); PL.left = 0; return drawPlayer(); }
  if (a === "set"){
    const r = rxFor(ex, PL.ph); PL.set++;
    if (PL.set >= r.sets){ PL.ei++; PL.set = 0; return drawPlayer(); }
    PL.rest = r.rest; PL.left = r.rest; drawPlayer();
    clearInterval(PL.timer);
    PL.timer = setInterval(()=>{
      if (!PL) return; PL.left--;
      if (PL.left <= 0){ clearInterval(PL.timer); PL.left = 0; beep(); drawPlayer(); return; }
      const tl = document.getElementById("tl"), arc = document.getElementById("arc");
      if (tl) tl.textContent = PL.left; if (arc){ const C = 2*Math.PI*84; arc.setAttribute("stroke-dashoffset", C*(1-PL.left/PL.rest)); }
    }, 1000);
  }
});

async function ask(q){
  if (!q || busy) return;

  }

    {name:"enregistrer_poids", description:"Enregistre la pesée du jour de "+p.name+" dans son suivi.", inputSchema:{type:"object", properties:{kg:{type:"number", description:"Poids en kg"}, tour_de_taille_cm:{type:"number"}}, required:["kg"]},
     execute: ({kg, tour_de_taille_cm}) => { const ok = addWeight(kg, iso(today()), tour_de_taille_cm); if (!ok) throw new Error("Poids invalide"); return {ok:true, enregistre:kg, objectif:p.goal, reste:Math.round((kg-p.goal)*10)/10}; }},
    {name:"valider_seance", description:"Coche une séance comme faite cette semaine.", inputSchema:{type:"object", properties:{numero:{type:"integer", minimum:1, maximum:4}}, required:["numero"]},
     execute: ({numero}) => { const si = numero-1; if (!weekDone(who).includes(si)) toggleDone(si, true); return {ok:true, seances_cette_semaine: weekDone(who).length}; }}
  ];
  const input = [{role:"user", content: context() + "\n\n---\nQuestion de " + p.name + " : " + chat[0].content}].concat(chat.slice(1));
  try {
    const res = await sample(input, {signal:ctrl.signal, cache:false, tools, onText:({text})=>{ bubble.innerHTML = md(text); msgsEl.scrollTop = msgsEl.scrollHeight; }});
    bubble.innerHTML = md(res.text || "…");
    chat.push({role:"assistant", content:res.text || ""});
  } catch(err){
    chat.pop();
    const fb = p.faq[q];
    if (err && err.code === "not_granted"){ sample = null; bubble.innerHTML = md(fb || "Le coach en direct n’est pas disponible ici. Choisis une des questions proposées."); }
    else if (err && err.code === "rate_limited"){ bubble.innerHTML = md("Je reprends mon souffle, réessaie dans une minute."); }
    else if (err && err.name === "AbortError"){ bubble.remove(); }
    else { bubble.innerHTML = md(fb || "Je n’ai pas pu répondre. Réessaie dans un instant."); }
  } finally { busy = false; }
}
$("#compose").addEventListener("submit", e=>{ e.preventDefault(); const v = $("#q").value.trim(); if (v){ $("#q").value = ""; ask(v); } });
function openCoach(){ $("#coach").classList.add("open"); }
$("#fab").addEventListener("click", openCoach);
$("#coachClose").addEventListener("click", ()=>$("#coach").classList.remove("open"));
(async ()=>{ try { sample = await claude.use("sample"); } catch(e){ sample = null; } })();

/* ===================== DÉMARRAGE ===================== */
document.body.dataset.who = who;
document.querySelectorAll(".switch button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.p===who));
renderAll(); resetChat();
</script>
